name: Android Release Build

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag 版本号 (例如: 1.4.6)'
        required: true
        default: '1.4.6'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag_version }}" >> "$GITHUB_OUTPUT"
            echo "Using manual input version: ${{ inputs.tag_version }}"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "Using push tag version: ${{ github.ref_name }}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Detect flavor from tag
        id: flavor
        run: |
          set -euo pipefail

          # zh flavor 已移除，plus 为默认 flavor；标签使用纯版本号（如 1.4.6）。
          flavor="plus"

          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "Detected flavor: $flavor (version: ${{ steps.version.outputs.version }})"

      - name: Prepare build files
        run: |
          set -euo pipefail

          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          mkdir -p "app/src/$FLAVOR"

          if [[ "$FLAVOR" == "plus" ]]; then
            # 直接写入合法的 json 内容，不再依赖 Secret 解码，彻底规避格式错误
            cat << 'EOF' > "app/src/plus/google-services.json"
{
  "project_info": {
    "project_number": "123456789012",
    "firebase_url": "https://dummy.firebaseio.com",
    "project_id": "dummy-project-id",
    "storage_bucket": "dummy-project-id.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
        "android_client_info": {
          "package_name": "com.example.dummy"
        }
      },
      "api_key": [
        {
          "current_key": "AIzaSyDummyKeyForTestingPurposesOnly123"
        }
      ],
      "services": {
        "analytics_service": {
          "status": 1
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            test -s "app/src/plus/google-services.json"
          else
            echo "Unknown flavor: $FLAVOR"
            exit 1
          fi

          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install Web UI dependencies
        run: npm ci
        working-directory: web-ui

      - name: Gradle Build Release
        run: |
          set -euo pipefail
          chmod +x gradlew

          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          FLAVOR_CAP="${FLAVOR^}"
          TASK="assemble${FLAVOR_CAP}Release"

          echo "Building release APK ($TASK)..."
          ./gradlew ":app:$TASK" --no-daemon --stacktrace

      - name: Upload build output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.flavor.outputs.flavor }}
          path: app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
